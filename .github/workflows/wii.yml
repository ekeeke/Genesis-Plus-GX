name: Genesis Plus GX Wii Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Wii
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Wii
      shell: bash
      run: |
        set -o pipefail
        if ! make -k -f Makefile.wii -j2 2>&1 | tee build.log; then
          msg=$(grep -E -B1 "error:|Error [0-9]|undefined reference|cannot find|No such file|not found" build.log | grep -v "^--$" | awk '!seen[$0]++' | head -n 150 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Wii build failed::$msg"
          exit 1
        fi

    - name: Package for the Homebrew Channel
      run: |
        mkdir -p dist/apps/genplus
        cp genplus_wii.dol dist/apps/genplus/boot.dol

    - name: Upload Wii build
      uses: actions/upload-artifact@v4
      with:
        name: GenesisPlusGX-Wii
        path: dist/

  probe:
    name: List devkitPPC images
    runs-on: ubuntu-latest
    steps:
    - name: List tags
      run: |
        tags=$(curl -s "https://hub.docker.com/v2/repositories/devkitpro/devkitppc/tags?page_size=100&ordering=last_updated" | python3 -c "import sys,json; print(' '.join(t['name']+'@'+t['last_updated'][:10] for t in json.load(sys.stdin)['results']))")
        echo "::notice title=devkitppc tags::$tags"
