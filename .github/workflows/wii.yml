name: Genesis Plus GX Wii Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Wii
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Wii
      shell: bash
      run: |
        set -o pipefail
        if ! make -f Makefile.wii -j2 2>&1 | tee build.log; then
          msg=$(grep -E -i -B2 -A2 "error|undefined reference|cannot find|no such file|not found" build.log | tail -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Wii build failed::$msg"
          exit 1
        fi

    - name: Package for the Homebrew Channel
      run: |
        mkdir -p dist/apps/genplus
        cp genplus_wii.dol dist/apps/genplus/boot.dol

    - name: Upload Wii build
      uses: actions/upload-artifact@v4
      with:
        name: GenesisPlusGX-Wii
        path: dist/
