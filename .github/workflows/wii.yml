name: Genesis Plus GX Wii Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build Wii
    runs-on: ubuntu-latest
    # libogc 3 (2026) removed lwp_threads.h, which the menu still uses
    container: devkitpro/devkitppc:20251231

    steps:
    - uses: actions/checkout@v4

    - name: Build Wii
      shell: bash
      run: |
        set -o pipefail
        if ! make -k -f Makefile.wii -j2 2>&1 | tee build.log; then
          msg=$(grep -E -B1 "error:|Error [0-9]|undefined reference|cannot find|No such file|not found" build.log | grep -v "^--$" | awk '!seen[$0]++' | head -n 150 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Wii build failed::$msg"
          exit 1
        fi

    - name: Package for the Homebrew Channel
      run: |
        mkdir -p dist/apps/genplus
        cp genplus_wii.dol dist/apps/genplus/boot.dol
        cp gx/hbc/meta.xml gx/hbc/icon.png LICENSE.txt dist/apps/genplus/

    - name: Upload Wii build
      uses: actions/upload-artifact@v4
      with:
        name: GenesisPlusGX-Wii
        path: dist/

  # Publishing a release on GitHub (for example tag v1.7.5-usb.2) builds it and
  # attaches the build as a .zip file. If the release text is empty, it is
  # filled from .github/RELEASE_NOTES.md.
  release:
    name: Attach the files to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: GenesisPlusGX-Wii
        path: artifacts

    - name: Zip and publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        (cd artifacts && zip -r -X "$GITHUB_WORKSPACE/GenesisPlusGX-Wii.zip" .)
        if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
          gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
        fi
        gh release upload "$TAG" GenesisPlusGX-Wii.zip --clobber
